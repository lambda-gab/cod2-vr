; Call of Duty 2 VR settings. The launcher's choices (%APPDATA%\CoD2-VR\settings.ini) win over these.

[General]
; 0 = the mod does nothing (plain d3d9 passthrough)
Enabled=1

[Proxy]
; The game's device is made a D3D9Ex device so it can share the eye images with the headset.
; 0 = plain D3D9 (no headset possible), only if the game misbehaves with 1.
D3D9Ex=1

[VR]
Enabled=1
; Without a headset: both eyes side by side on the monitor (stereo test)
SideBySideWithoutHeadset=1
; Side by side: distance between the eyes, game units (1 unit = 1 inch)
Separation=2.5
; Game units per metre
WorldScale=39.37
; 1 = moving your head moves the camera, 0 = rotation only
PositionalTracking=1
; 1 = the game aims where you look (head yaw and pitch)
HeadAim=1
; Eye resolution, times the headset's recommended size (0.5 .. 2.0)
RenderScale=1.0
; Degrees drawn beyond the edges of the view (reprojection on quick head turns)
CullMargin=10
; 1 = the left eye is shown in the game window
Mirror=1

[HUD]
; 1 = the HUD screen follows the head
HeadLocked=1
; metres in front of the eyes, metres up, width while playing and in menus
Distance=1.4
OffsetY=-0.05
Width=1.0
MenuWidth=1.8

[Debug]
; Log the renderer's backend commands of this many frames with the world
TraceCommands=0
; Test without a headset: the headset path with made-up eyes (asymmetric fov), shown side by side
; with the HUD screen in the lower right corner
FakeHeadset=0
FakeEyeWidth=1440
FakeEyeHeight=1584
