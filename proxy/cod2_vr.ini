; Call of Duty 2 VR settings. The launcher's choices (%APPDATA%\CoD2-VR\settings.ini) win over these.

[General]
; 0 = the mod does nothing (plain d3d9 passthrough)
Enabled=1

[Proxy]
; The game's device is made a D3D9Ex device so it can share the eye images with the headset.
; 0 = plain D3D9 (no headset possible), only if the game misbehaves with 1.
D3D9Ex=1

[VR]
Enabled=1
; Without a headset: both eyes side by side on the monitor (stereo test)
SideBySideWithoutHeadset=1
; Side by side: distance between the eyes, game units (1 unit = 1 inch)
Separation=2.5
; Game units per metre
WorldScale=39.37
; 1 = moving your head moves the camera, 0 = rotation only
PositionalTracking=1
; 1 = the view stops a little before a wall when you lean or walk into it (door frames, corners), 0 = it goes
; wherever your head goes
HeadCollision=1
; antialiasing of the eyes (smooths edges, fences and wires): 1 = off, 2, 4, 8 samples (4 suits most PCs). Test option
MSAA=1
; 1 = roomscale: walk and lean for real, the soldier follows your body (walls still stop him); 0 = the soldier
; stays where the stick puts him and your head moves around him
RoomScale=0
; 1 = the game's view follows the aim (the gun hand, see [Controllers] WeaponInHand, or the head)
HeadAim=1
; metres added to your height in the game (negative = shorter); recenter with the left stick click
HeightOffset=0
; Eye resolution, times the headset's recommended size (0.5 .. 2.0)
RenderScale=1.0
; Degrees drawn beyond the edges of the view (reprojection on quick head turns)
CullMargin=10
; 1 = the left eye is shown in the game window
Mirror=1

; 1 = smoke, fire and the other effects are drawn wherever the gun points (fx_cull 0; the game culls them by its
; own view, the aim, and they vanished when aiming at the floor)
FxAlways=1

[HUD]
; 1 = the HUD screen follows the head
HeadLocked=1
; metres in front of the eyes, metres up, width while playing and in menus
Distance=1.4
OffsetY=-0.05
Width=1.0
MenuWidth=1.8
; 1 = turning the back of your off hand to your eyes (as to look at a watch) shows the objectives, on that hand
ObjectivesGesture=1
; the objectives' width on the back of the hand, metres
ObjectivesWatchWidth=0.34
; opacity of the dark rounded panel behind them, 0 (none) .. 1
ObjectivesBackground=0.88
; room between the panel's edge and the objectives, share of the screen on each side (0 .. 0.2)
ObjectivesMargin=0.02
; what of the game's HUD stays on screen: 0 everything, 1 nothing (immersive), 2 only the subtitles, 3 only the compass,
; 4 only health and ammo. Holding the objectives shows everything. (The game's own fading of each part is what is used.)
HudMode=0
; how big the subtitles are: 1 = a little bigger than the game's (x 1.25), 1.5, 2.2, 3 = for reading from far away
SubtitleSize=1.5

[Controllers]
; 1 = right-handed: the right hand holds the gun and points in menus
RightHanded=1
; left-handed: 1 = the gun in the left hand is drawn mirrored (as a left-handed gun), 0 = as it is
MirrorLeftHand=1
; how you move: 2 = Continuous (walk with the stick); 0 = Blink (beta: push the move stick forward to aim an arc with
; that stick's hand, let go to jump there, the screen blinks), 1 = Shift (beta: the same, gliding there). Pull the stick
; back to cancel. Ladders: push the move stick into one to climb (the view looks up for it)
MoveMode=2
; which stick moves you: 0 = the left one, 1 = the right one; -1 = the stick of the hand without the gun.
; The other stick turns and changes stance ([Buttons] TurnStick*)
MoveStick=-1
; degrees per flick of the turn stick, 0 = smooth turn; smooth turn speed, degrees per second
SnapTurn=45
SmoothTurnSpeed=150
; 1 = the gun is in your gun hand and aims where it points (the head aims when that controller is not tracked)
WeaponInHand=1
; metres along the gun where the shots cross the barrel line (the game fires from the soldier's eye)
ConvergeDistance=15
; 1 = your shots leave the gun's muzzle along the barrel (0 = the flat game's: from the soldier's eye towards a point
; ConvergeDistance along the barrel); MuzzleDistance = metres from the controller to the muzzle
FireFromGun=1
MuzzleDistance=0.45
; where the gun sits relative to the eye in the original game (game units, 1 = 2.5 cm): that spot is
; placed in your hand. Read again every second: tune them while playing.
WeaponOffsetForward=10
WeaponOffsetRight=5
WeaponOffsetUp=-7
; gun angle relative to the controller, degrees: pitch (positive = barrel up) and yaw (positive = left)
WeaponPitch=0
WeaponYaw=0
; smooths the gun's direction held with one hand (seconds, e.g. 0.03); 0 = off. Steadier aim, a little lag
AimSmoothing=0
; 1 = raising the gun to your eye, lined up with the view, aims down the sights (+speed) while it stays there
AutoADS=0
; 1 = scoped rifles go to their zoom and back at once (no aim-down-sights animation)
InstantAds=1
; 1 = the other hand's grip in front of the gun hand holds the gun with both hands (the barrel points from the gun
; hand to it); pressed anywhere else that grip runs [Buttons] SecondaryGrip (nothing by default)
TwoHanded=1
; metres between the hands within which that grip takes the gun
TwoHandReach=0.7
; metres the other hand holds below the barrel line
TwoHandGripHeight=0.04
; held with both hands: aim steadiness, 0 (off) .. 1 (steadiest; deliberate swings still follow quickly)
TwoHandStabilization=0.75
; held with both hands: share of the recoil taken away, 0 (the game's own) .. 1 (none)
TwoHandRecoilReduction=0.8
; 1 = swinging the gun into someone (any part of it, stock to muzzle) hits him; how fast it must move, m/s,
; and the damage (no melee animation: the blow is the gun you swing)
SwingMelee=1
MeleeSpeed=2.2
MeleeDamage=150
; vibration on reaching a body zone (shoulders, lower back) and taking from it
HapticsHolsters=0.6
; 1 = two light taps on reaching a body zone (not again within a second) and a double click on taking from it;
; 0 = one tick on reaching it
HolsterHum=1

[Hands]
; the soldier's arms (when they are shown: launcher VR > Player hands = Shown, no main\zz_cod2vr.iwd):
; 1 = they follow your controllers from your own shoulders (the gun hand stays on the gun, the other hand goes to its
; controller unless it holds the gun's front), 0 = the game's animation
ArmBones=1
; your shoulders, cm from your eyes: down, to the side, back
ShoulderDown=20
ShoulderSide=18
ShoulderBack=5
; your arm, metres from the shoulder to the wrist, 0 = 0.55 (the soldier's)
ArmLength=0
; where the off hand's wrist is from its controller, cm: forward (negative = behind), left, up
OffHandX=-10
OffHandY=0
OffHandZ=-2

[Holsters]
; The gun stays in the dominant hand. Either hand's grip over a shoulder (the hand at the side of the
; head, a little behind it) or at the lower back does what is set here: primary / primaryb (weapon 1 / 2), switch (the other one),
; binocular (up while the grip holds them), grenade or smokegrenade (the pin is pulled as the grip takes it, it stays in that hand and is thrown, along the
; hand's swing, when the grip lets go: held longer than its fuse, 3.5 s, it goes off in the hand), none.
RightShoulder=primary
LeftShoulder=primaryb
LowerBack=grenade
; the chest and the waist (as the CoD 1 mod's): the waist's left holds the smoke grenades (Call of Duty 2 has them)
Chest=binocular
WaistLeft=smokegrenade
WaistRight=none
WaistFront=none
; zone heights in metres from your eyes (negative = below): the shoulders begin below the eyes at
; BackHeight, the lower back is around LowerBackHeight; ChestNear and WaistReach as in the CoD 1 mod
BackHeight=-0.30
HipHeight=-0.75
LowerBackHeight=-0.70
ChestNear=-0.12
WaistReach=0.32
; half the chest zone's width
ChestWidth=0.30
; 1 = the game's grenades are held while their button is (pin pulled) and thrown when it is let go, as the mods of
; the game do with "cookOffHold"; 0 = the game's own (thrown right after the pin is pulled)
GrenadeHold=1
; msec at most to put a weapon away and raise the next one (the hand takes it from the shoulder); 0 = the game's own
DrawTime=50
; a crosshair where the gun is aimed (for playing without aiming down the sights): 0 none, 1 cross,
; 2 dot, 3 circle, 4 circle + dot, 5 cross + dot; its size in degrees
Crosshair=0
; its colour: white, red, green, yellow, cyan, blue, orange, magenta or RRGGBB (the launcher's colour picker), and opacity 0.1 .. 1
CrosshairColor=white
CrosshairOpacity=0.8
CrosshairSize=1.5
; 1 = shots fired without the game's aim-down-sights button are as accurate as aimed ones (in VR you aim with the
; gun's own sights); 0 = the game's hip fire spread (several degrees: the shots scatter around the crosshair)
HipFireAccuracy=1
; controller vibration on your shots: 0 = off, 0.6 = normal, 1 = strong
HapticsShots=0.6
; both controllers shake when you are hit (harder for more damage), a long shake when you die: 0 = off .. 1
HapticsDamage=0.6
; 1 = crouching for real crouches the soldier (and standing up stands him); recenter standing up straight
PhysicalCrouch=1
; metres your head goes below its standing height to crouch
CrouchDepth=0.32

[Buttons]
; game commands; "+command" is held while the button is pressed, "a|b" runs a on press and b on release,
; "key:NAME" presses a key (ESCAPE, ENTER, TAB, SPACE, BACKSPACE, arrows). Empty = nothing.
; vr:recenter, vr:vignette (the comfort vignette's next strength), vr:turnleft / vr:turnright (the turn stick).
; Primary = gun hand, Secondary = the other hand. A/B are on the right controller, X/Y on the left.
; <button>Hold: held half a second it runs this instead (a short press runs the button's own command).
; vr:switchweapon: weapon 1 <-> weapon 2.
PrimaryTrigger=+attack
; as the CoD 1 mod: the gun hand's grip uses / picks up (and takes from the body zones), the other one holds the
; handguard (and takes from the zones); melee is a swing of the gun
PrimaryGrip=+activate
; the other hand's trigger at something made to be used (a switch, explosives to plant: a trigger_use) uses it instead
; nothing by default: aiming down the sights belongs to mouse and keyboard
SecondaryTrigger=
SecondaryGrip=
A=+gostand
B=+reload
X=+frag
Y=weapnext
; press: recenter (stand up straight), hold: objectives
LeftStickClick=vr:recenter
LeftStickClickHold=+scores
RightStickClick=toggleprone
Menu=key:ESCAPE
; the stick that does not move you
TurnStickUp=raisestance
TurnStickDown=lowerstance
TurnStickLeft=vr:turnleft
TurnStickRight=vr:turnright
; Shortcuts: the two buttons of the hand without the gun (X and Y right-handed, A and B left-handed) held, then
; another face button pressed: Shortcut<held><pressed> runs instead of that button's own command. A button with a
; shortcut set runs its own command when tapped alone (on release; a "+command" held 0.2 s is held). Default:
; Y + A (right-handed) or B + X (left-handed) switches weapons.
ShortcutYA=vr:switchweapon
ShortcutBX=vr:switchweapon
ShortcutYB=
ShortcutYX=
ShortcutXA=
ShortcutXB=
ShortcutXY=
ShortcutAB=
ShortcutAX=
ShortcutAY=
ShortcutBA=
ShortcutBY=

[Grenade]
; grenade line: where a grenade in your hand will fly and land (from your eyes, the way the hand that holds it
; points; a swing throws along the swing). 0 = off, 1 or 2 = while a grenade is in your hand. It stops where it hits
; the map, with a ring there; bounces are not simulated
Trajectory=1
; the game's gravity (g_gravity), units per second squared
Gravity=800
; line opacity, 0.05 (faint) .. 1 (solid white)
Opacity=0.6

[PostFX]
; image effects in the headset, applied after the game draws (as the Call of Duty 1 VR mod's)
; sharpening, 0 (off) .. 1 (strong): gives the old textures their definition back
Sharpen=0
; colour style: original (the game's own), natural, cinema (muted, warm war film), vivid
Color=original
; glow around bright light (fire, explosions, sky): 0 = off, 0.15 = low, 0.3 = medium
Bloom=0
; brightness where the glow starts, 0 .. 0.95
BloomThreshold=0.7

[Comfort]
; how much of the camera shake (earthquakes, shelling, explosions) is kept: 1 = all of it (the game's own),
; 0.4 = reduced, 0 = none. Only the camera's position shakes in VR; your head turns the view
ShakeKeep=0.4
; 1 = when a scripted scene takes over the game's view, the picture keeps showing the way you were facing instead of
; jumping (your head turns freely over the scene); 0 = it turns to where the game points
KeepLook=1
; 1 = the weapon's animations (reloading above all) move the camera, as in the flat game; 0 = not in VR (the world
; stays still around your head)
WeaponCamera=0
; 1 = the training's "invert the mouse's up / down?" question (after the teddy bears) is answered no in VR
SkipInvertMenu=1
; 1 = the view narrows while you move with the stick or turn smoothly (helps against VR sickness);
; walking for real and snap turns do not narrow it
Vignette=1
; how far it closes, 0 (not at all) .. 1 (to a small circle)
VignetteStrength=0.6
; game units per second you must be moving for it to close (fully at twice)
VignetteSpeed=40
; smooth turning, degrees per second where it starts closing
VignetteTurn=45

[Debug]
; Log the renderer's backend commands of this many frames with the world
TraceCommands=0
; Test without a headset: the headset path with made-up eyes (asymmetric fov), shown side by side
; with the HUD screen in the lower right corner
FakeHeadset=0
FakeEyeWidth=1440
FakeEyeHeight=1584
; FakeHeadset: a still gun hand held out at the right of the chest (the gun is placed there)
FakeHand=0
; log the left eye's pixels at the corners and the centre while a full-screen picture (intro screen, hit flash) is in
; the eyes ("eye probe:" lines, at most 15 in the headset)
ProbeEyes=0

[WeaponOffsets]
; a weapon's own spot in the hand, replacing WeaponOffsetForward / Right / Up for it: <weapon> = forward right up
; (the weapon's file name, as the log's "weapon offset for" lines name it). Read again every second, e.g.
; m1garand=10 5 -7
